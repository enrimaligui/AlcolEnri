services:
  - type: web
    name: alcolenri
    plan: free
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn alcolenri.wsgi:application --bind 0.0.0.0:$PORT'
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: '0'
      - key: ALLOWED_HOSTS
        value: '*'
      - key: CSRF_TRUSTED_ORIGINS
        value: 'https://alcolenri.onrender.com'
      - key: DATABASE_URL
        sync: false
      - key: ALCOLENRI_SYNC_KEY
        sync: false
